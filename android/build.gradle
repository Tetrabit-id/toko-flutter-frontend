allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Older plugins (e.g. blue_thermal_printer) don't declare a namespace, which AGP 8 requires.
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        if (sub.android.namespace == null) {
            def manifest = sub.file("src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                sub.android.namespace = new XmlSlurper().parse(manifest).@package.text()
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
