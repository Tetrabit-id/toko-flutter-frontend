    - assets/svg/not_found_user.svg
    - assets/svg/not_found_stok.svg
    - assets/svg/not_found_laporan.svg
    - assets/svg/not_found_orderan.svg
    - assets/svg/cabang.svg
    - assets/svg/stok.svg
    - assets/svg/user.svg
